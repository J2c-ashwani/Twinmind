services:
  - type: web
    name: twinmind-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.asmind.app
      - key: PAYMENTS_PROVIDER
        value: google_play
      - key: PLAY_STORE_URL
        value: https://play.google.com/store/apps/details?id=com.asmind.app
      - key: GOOGLE_PLAY_MONTHLY_PRODUCT_ID
        value: premium_monthly
      - key: GOOGLE_PLAY_YEARLY_PRODUCT_ID
        value: premium_yearly
