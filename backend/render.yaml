services:
  - type: web
    name: twinmind-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.asmind.app
      - key: PAYMENTS_PROVIDER
        value: google_play
      - key: PLAY_STORE_URL
        value: https://play.google.com/store/apps/details?id=com.asmind.app
      - key: GOOGLE_PLAY_MONTHLY_PRODUCT_ID
        value: premium_monthly
      - key: GOOGLE_PLAY_YEARLY_PRODUCT_ID
        value: premium_yearly
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "TwinGenie <notifications@mail.twingenie.app>"
      - key: RESEND_REPLY_TO
        value: "founder@twingenie.app"
      - key: PR_FROM_EMAIL
        value: "Ashwani Kumar <ashwani@mail.twingenie.app>"
      - key: PR_REPLY_TO
        value: "ashwani@twingenie.app"
      - key: INVESTOR_FROM_EMAIL
        value: "Ashwani Kumar <ashwani@mail.twingenie.app>"
      - key: INVESTOR_REPLY_TO
        value: "ashwani@twingenie.app"
      - key: ACQUISITION_FROM_EMAIL
        value: "Ashwani Kumar <ashwani@mail.twingenie.app>"
      - key: ACQUISITION_REPLY_TO
        value: "ashwani@twingenie.app"
      - key: CAMPAIGN_AUTORUN
        value: "true"
      - key: CAMPAIGN_DAILY_MAX
        value: "12"
      - key: INSTAGRAM_ACCOUNT_ID
        value: "17841473412113239"
      - key: THREADS_USER_ID
        value: "29098705129742004"
      - key: THREADS_ACCESS_TOKEN
        sync: false
      - key: THREADS_APP_ID
        value: "2013179896269227"
      - key: THREADS_APP_SECRET
        sync: false
